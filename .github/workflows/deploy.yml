name: 🚀 Deploy

# Deployment is deliberately separate from PR CI and must be started by a
# maintainer. Configure required reviewers on the `production` environment in
# GitHub repository settings before using this workflow.
on:
  # Preserve the current dev-to-staging flow, but never deploy production on a
  # branch push.
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.target }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    name: 🚀 Deploy
    needs: tests
    # Pushes may deploy only dev to staging. Production requires an explicit
    # workflow_dispatch from main and the protected production environment.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    steps:
      - name: ⬇️ Checkout reviewed ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.0.2
        id: app_name
        with:
          file: apps/webapp/fly.toml
          field: app

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      # flyctl builds and deploys the selected source ref. Production runs only
      # after its protected environment is approved; this does not publish GHCR.
      - name: 🚀 Deploy Staging
        if: ${{ github.event_name == 'push' || inputs.target == 'staging' }}
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${GITHUB_SHA} --app "$FLY_APP_NAME" --dockerfile apps/webapp/Dockerfile
        env:
          FLY_APP_NAME: ${{ steps.app_name.outputs.value }}-staging
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ inputs.target == 'production' }}
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${GITHUB_SHA} --app "$FLY_APP_NAME" --dockerfile apps/webapp/Dockerfile
        env:
          FLY_APP_NAME: ${{ steps.app_name.outputs.value }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
