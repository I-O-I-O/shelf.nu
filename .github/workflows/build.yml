name: 🐳 Publish a Docker image

# Publishing is a separate, manually started release operation. Run this
# workflow against a `shelf@X.Y.Z` tag after its source has been reviewed.
# Configure required reviewers on the `image-publishing` environment.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example shelf@2.1.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: ✅ Validate release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - name: ⬇️ Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ✅ Resolve reviewed release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^shelf@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as shelf@2.1.2 or shelf@2.1.2-rc.1"
            exit 1
          fi

          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist in the checked repository"
            exit 1
          }

          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag must point to a commit already contained in main"
            exit 1
          }

          version="${RELEASE_TAG#shelf@}"
          echo "commit_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only advance `latest` when publishing a stable tag for the exact
          # main commit selected by this dispatch; republishing an older tag
          # must not move the channel backwards.
          if [[ "$version" != *-* && "$release_sha" == "$GITHUB_SHA" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 🐳 Publish release image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: image-publishing
    steps:
      - name: ⬇️ Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: 🥡 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: ✖️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ⚡️ Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ needs.validate.outputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 👋 Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Extract release image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.validate.outputs.latest == 'true' }}
            type=raw,value=${{ needs.validate.outputs.version }}

      - name: 🛠 Build and publish Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/webapp/Dockerfile.image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            COMMIT_SHA=${{ needs.validate.outputs.commit_sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      - name: 🚚 Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
